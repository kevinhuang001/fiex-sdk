[package]
name = "fiex-plugin-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-or-later"
description = "Standalone native process protocol SDK for Fiex plugins"

[features]
default = []
tokio = ["dep:tokio"]

[dependencies]
fiex-plugin-sdk-macros = { path = "../macros", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared_memory = "0.12"
base64 = "0.22"

tokio = { version = "1", optional = true, features = ["io-util", "rt", "sync", "time"] }
